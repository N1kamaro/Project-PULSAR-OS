<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PULSAR OS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="welcome">

        <p class="system-code">
            PULSAR // WEB HARDWARE INTERFACE
        </p>

        <div class="pulsar-art">

            <div class="beam beam-left"></div>
            <div class="beam beam-right"></div>

            <div class="orbit orbit-1"></div>
            <div class="orbit orbit-2"></div>

            <div class="core"></div>

        </div>

        <p class="status">
            [ SIGNAL ACQUIRED ]
        </p>

        <h1>PULSAR</h1>

        <p class="os-label">
            OPERATING SYSTEM
        </p>

        <div class="separator">
            <span>+</span>
            <div class="line"></div>
            <span>+</span>
        </div>

        <p class="description">
            A web-based operating system designed to connect,
            monitor and interact with microcontrollers.
        </p>

        <p class="quote">
            A STAR. A SIGNAL. AN INTERFACE.
        </p>

        <a class="enter-button" href="#">
            [ ENTER SYSTEM ]
        </a>

        <div class="system-info">

            <span>CORE // READY</span>

            <span>NO DEVICE</span>

            <span>BUILD // 0.1</span>

        </div>

    </main>

</body>

</html>
